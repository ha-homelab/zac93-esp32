# Shared settings; ESPHome is flashed to the ESP32, never to the ZAC93.
esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1
  compile_process_limit: 2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    # Reuse the API Noise PSK and reject unencrypted uploaders.
    encryption: {}

packages:
  radio: !include radio.yaml
