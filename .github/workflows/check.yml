name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
    with:
      force-full: false
      documentation-paths: "[\"GOVERNANCE.md\", \"README.de.md\", \"README.es.md\", \"README.ru.md\", \"ROADMAP.md\", \"wiki/Connection-ar.md\", \"wiki/Connection-bn.md\", \"wiki/Connection-cs.md\", \"wiki/Connection-de.md\", \"wiki/Connection-es.md\", \"wiki/Connection-fa.md\", \"wiki/Connection-fr.md\", \"wiki/Connection-he.md\", \"wiki/Connection-hi.md\", \"wiki/Connection-id.md\", \"wiki/Connection-it.md\", \"wiki/Connection-ja.md\", \"wiki/Connection-ko.md\", \"wiki/Connection-nl.md\", \"wiki/Connection-pl.md\", \"wiki/Connection-pt.md\", \"wiki/Connection-ru.md\", \"wiki/Connection-th.md\", \"wiki/Connection-tr.md\", \"wiki/Connection-uk.md\", \"wiki/Connection-vi.md\", \"wiki/Connection-zh-Hans.md\", \"wiki/Connection-zh-Hant.md\", \"wiki/Connection.md\", \"wiki/Home-ar.md\", \"wiki/Home-bn.md\", \"wiki/Home-cs.md\", \"wiki/Home-de.md\", \"wiki/Home-es.md\", \"wiki/Home-fa.md\", \"wiki/Home-fr.md\", \"wiki/Home-he.md\", \"wiki/Home-hi.md\", \"wiki/Home-id.md\", \"wiki/Home-it.md\", \"wiki/Home-ja.md\", \"wiki/Home-ko.md\", \"wiki/Home-nl.md\", \"wiki/Home-pl.md\", \"wiki/Home-pt.md\", \"wiki/Home-ru.md\", \"wiki/Home-th.md\", \"wiki/Home-tr.md\", \"wiki/Home-uk.md\", \"wiki/Home-vi.md\", \"wiki/Home-zh-Hans.md\", \"wiki/Home-zh-Hant.md\", \"wiki/Home.md\", \"wiki/Troubleshooting-ar.md\", \"wiki/Troubleshooting-bn.md\", \"wiki/Troubleshooting-cs.md\", \"wiki/Troubleshooting-de.md\", \"wiki/Troubleshooting-es.md\", \"wiki/Troubleshooting-fa.md\", \"wiki/Troubleshooting-fr.md\", \"wiki/Troubleshooting-he.md\", \"wiki/Troubleshooting-hi.md\", \"wiki/Troubleshooting-id.md\", \"wiki/Troubleshooting-it.md\", \"wiki/Troubleshooting-ja.md\", \"wiki/Troubleshooting-ko.md\", \"wiki/Troubleshooting-nl.md\", \"wiki/Troubleshooting-pl.md\", \"wiki/Troubleshooting-pt.md\", \"wiki/Troubleshooting-ru.md\", \"wiki/Troubleshooting-th.md\", \"wiki/Troubleshooting-tr.md\", \"wiki/Troubleshooting-uk.md\", \"wiki/Troubleshooting-vi.md\", \"wiki/Troubleshooting-zh-Hans.md\", \"wiki/Troubleshooting-zh-Hant.md\", \"wiki/Troubleshooting.md\", \"wiki/_Sidebar.md\"]"
  secrets:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private artifacts and literal YAML credentials
        run: python3 scripts/check_publication.py
      - name: Install verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history" --redact=100 --ignore-gitleaks-allow --no-banner'
  check:
    needs: ["scope"]
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require successful change classification
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = ['scope']
          if set(results) != set(expected):
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          for name, value in results.items():
              wanted = 'success' if run == 'true' or name == 'scope' else 'skipped'
              if value['result'] != wanted:
                  raise SystemExit(f'Unexpected validation result: {name}={value["result"]}, expected {wanted}')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned ESPHome and Python analysis
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip install --require-hashes --no-build-isolation --only-binary=:all: --no-binary=crcmod,esptool,paho-mqtt -r requirements.lock -r requirements-ci.lock
      - name: Check URL handling and documentation
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: |
          python -m ruff check --select E4,E7,E9,F scripts tests
          python -m unittest discover -s tests -v
          python scripts/check_docs.py
          python scripts/render_diagrams.py
          git diff --exit-code -- assets/diagrams
      - name: Build both boards with disposable credentials
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: python scripts/validate_configs.py --compile
      - name: Validate documentation without installing firmware toolchains
        if: ${{ needs.scope.outputs.run == 'false' }}
        run: |
          python3 scripts/check_docs.py
          python3 scripts/render_diagrams.py
          git diff --exit-code -- assets/diagrams
      - name: Test documentation-scope gate contracts
        run: python3 .github/workflow-tests/test_docs_scope.py
