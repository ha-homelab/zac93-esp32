version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # CodeQL init, autobuild, analyze and SARIF upload share one release.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
