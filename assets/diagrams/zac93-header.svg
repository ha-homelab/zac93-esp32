<text x="48" y="471" fill="#142c47" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">Our four wires use pins 1, 6, 8 and 10. Pin 9 is another ground; leave it unused.</text>
<text x="48" y="509" fill="#142c47" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Hardware v2 connects pin 7 to reset. This project does not drive pin 7.</text>
