<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Two different connection URLs used by the system">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="540" rx="22" fill="#f4f7fb"/>
<text x="48" y="59" fill="#142c47" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">Use the right URL in the right application</text>
<rect x="48" y="110" width="1104" height="160" rx="16" fill="white" stroke="#d8e2ee" stroke-width="2"/>
<text x="75" y="148" fill="#142c47" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">Z-Wave JS UI → Settings → Z-Wave → Serial Port</text>
<text x="75" y="194" fill="#087d89" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">esphome://zac93-wroom.local:6053?key=ENCODED_KEY</text>
<text x="75" y="237" fill="#142c47" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Connects the driver to the ESP32. The key is private; encode + / =.</text>
<rect x="48" y="300" width="1104" height="160" rx="16" fill="white" stroke="#d8e2ee" stroke-width="2"/>
<text x="75" y="338" fill="#142c47" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">Home Assistant → Z-Wave → server URL</text>
<text x="75" y="384" fill="#087d89" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">ws://zwave-js-ui:3000</text>
<text x="75" y="427" fill="#142c47" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Connects Home Assistant to the driver, not directly to the ESP32.</text>
<text x="48" y="507" fill="#142c47" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Illustration of fields, not a screenshot. Hostnames are examples. The web UI itself uses port 8091.</text>
</svg>
