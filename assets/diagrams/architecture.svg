<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Z-Wave to Home Assistant system architecture">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="590" rx="22" fill="#f4f7fb"/>
<text x="48" y="60" fill="#142c47" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">One radio. One Z-Wave driver. Two firmware domains.</text>
<rect x="48" y="180" width="243" height="200" rx="16" fill="white" stroke="#d8e2ee" stroke-width="2"/>
<text x="68" y="229" fill="#142c47" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">Z-Wave device</text>
<text x="68" y="282" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">PIR • switch • sensor</text>
<text x="68" y="312" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">US/CA/MX variant</text>
<rect x="335" y="180" width="243" height="200" rx="16" fill="white" stroke="#d8e2ee" stroke-width="2"/>
<text x="355" y="229" fill="#142c47" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">ZAC93</text>
<text x="355" y="282" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Zooz radio firmware</text>
<text x="355" y="312" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Serial API controller</text>
<rect x="622" y="180" width="243" height="200" rx="16" fill="white" stroke="#d8e2ee" stroke-width="2"/>
<text x="642" y="229" fill="#142c47" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">ESP32</text>
<text x="642" y="282" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">ESPHome zwave_proxy</text>
<text x="642" y="312" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Wi-Fi network bridge</text>
<rect x="909" y="180" width="243" height="200" rx="16" fill="white" stroke="#d8e2ee" stroke-width="2"/>
<text x="929" y="229" fill="#142c47" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">Z-Wave JS</text>
<text x="929" y="282" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Driver + network keys</text>
<text x="929" y="312" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Home Assistant client</text>
<path d="M295,255 L327,255" stroke="#087d89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="310" y="157" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="middle">RF</text>
<path d="M582,255 L614,255" stroke="#087d89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="597" y="157" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="middle">UART</text>
<path d="M869,255 L901,255" stroke="#087d89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="884" y="157" fill="#142c47" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="middle">API</text>
<rect x="48" y="420" width="1104" height="123" rx="16" fill="#173d63" stroke="#173d63" stroke-width="2"/>
<text x="73" y="461" fill="white" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="start">ESPHome runs on ESP32. The ZAC93 keeps its Zooz firmware.</text>
<text x="73" y="500" fill="#d7e5f2" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Z-Wave devices appear through the Z-Wave integration; ESPHome exposes bridge diagnostics.</text>
</svg>
